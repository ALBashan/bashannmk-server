<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פאנל ניהול — בשן רדיאטורים וחלפים</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-wrap { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .admin-table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
    .admin-table th, .admin-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right; font-size: 0.9rem; }
    .admin-table th { background: var(--navy); color: #fff; }
    .admin-table select { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); font-family: inherit; }
    .admin-section { margin-bottom: 40px; }
    .admin-login { max-width: 380px; margin: 60px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: var(--shadow); }
    .order-detail { font-size: 0.82rem; color: var(--muted); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="container topbar-inner">
      <span>👑 פאנל ניהול — בשן רדיאטורים וחלפים</span>
      <span><a href="/" style="color:#cfdcea">→ חזרה לאתר</a></span>
    </div>
  </div>

  <div id="admin-login" class="admin-login">
    <h3 style="color:var(--navy);margin-bottom:14px">כניסת מנהל</h3>
    <form id="admin-login-form" class="auth-form">
      <label>אימייל<input name="email" type="email" required></label>
      <label>סיסמה<input name="password" type="password" required></label>
      <button class="btn btn-primary btn-block" type="submit">כניסה</button>
    </form>
    <div id="admin-error" class="form-error"></div>
  </div>

  <div id="admin-panel" class="admin-wrap hidden">
    <div class="admin-section">
      <h2 style="color:var(--navy)">🧑‍💼 סוחרים</h2>
      <p class="form-note" style="margin-bottom:10px">אישור חשבון פותח לסוחר גישה למחירים ולביצוע הזמנות.</p>
      <table class="admin-table">
        <thead><tr><th>#</th><th>חברה</th><th>ח.פ</th><th>איש קשר</th><th>טלפון</th><th>אימייל</th><th>סטטוס</th></tr></thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>

    <div class="admin-section">
      <h2 style="color:var(--navy)">📦 הזמנות</h2>
      <table class="admin-table">
        <thead><tr><th>מס' הזמנה</th><th>תאריך</th><th>חברה</th><th>פריטים</th><th>סה"כ</th><th>סטטוס</th></tr></thead>
        <tbody id="orders-body"></tbody>
      </table>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    let TOKEN = localStorage.getItem('bashan_token') || null;

    function toast(msg, isError) {
      const t = $('toast');
      t.textContent = msg;
      t.className = 'toast' + (isError ? ' error' : '');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.add('hidden'), 3000);
    }

    async function api(path, opts = {}) {
      const h = { 'Content-Type': 'application/json' };
      if (TOKEN) h['Authorization'] = 'Bearer ' + TOKEN;
      const res = await fetch(path, { headers: h, ...opts });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'שגיאה');
      return data;
    }

    $('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(e.target));
      try {
        const res = await api('/api/auth/login', { method: 'POST', body: JSON.stringify(f) });
        if (res.user.role !== 'admin') throw new Error('חשבון זה אינו מנהל');
        TOKEN = res.token;
        localStorage.setItem('bashan_token', TOKEN);
        showPanel();
      } catch (err) {
        $('admin-error').textContent = err.message;
      }
    });

    const stUser = { pending: '⏳ ממתין', approved: '✅ מאושר', rejected: '❌ נדחה' };
    const stOrder = { new: 'חדשה', processing: 'בטיפול', shipped: 'נשלחה', done: 'הושלמה', cancelled: 'בוטלה' };

    async function showPanel() {
      $('admin-login').classList.add('hidden');
      $('admin-panel').classList.remove('hidden');
      await Promise.all([loadUsers(), loadOrders()]);
    }

    async function loadUsers() {
      const res = await api('/api/admin/users');
      $('users-body').innerHTML = res.users.map((u) => `
        <tr>
          <td>${u.id}</td><td>${u.company}</td><td>${u.hp}</td><td>${u.name}</td>
          <td>${u.phone || '—'}</td><td>${u.email}</td>
          <td>${u.role === 'admin' ? '👑 מנהל' : `
            <select onchange="setUserStatus(${u.id}, this.value)">
              <option value="pending" ${u.status === 'pending' ? 'selected' : ''}>⏳ ממתין</option>
              <option value="approved" ${u.status === 'approved' ? 'selected' : ''}>✅ מאושר</option>
              <option value="rejected" ${u.status === 'rejected' ? 'selected' : ''}>❌ נדחה</option>
            </select>`}
          </td>
        </tr>`).join('') || '<tr><td colspan="7">אין סוחרים רשומים</td></tr>';
    }

    async function setUserStatus(id, status) {
      try {
        await api(`/api/admin/users/${id}/status`, { method: 'POST', body: JSON.stringify({ status }) });
        toast('הסטטוס עודכן: ' + stUser[status]);
      } catch (err) { toast(err.message, true); }
    }

    async function loadOrders() {
      const res = await api('/api/admin/orders');
      $('orders-body').innerHTML = res.orders.map((o) => `
        <tr>
          <td><strong>${o.number}</strong></td>
          <td>${new Date(o.createdAt).toLocaleDateString('he-IL')}</td>
          <td>${o.company}</td>
          <td class="order-detail">${o.items.map((i) => `${i.sku} × ${i.qty}`).join('<br>')}${o.notes ? '<br>📝 ' + o.notes : ''}</td>
          <td>₪${o.total.toLocaleString('he-IL')}</td>
          <td>
            <select onchange="setOrderStatus(${o.id}, this.value)">
              ${Object.entries(stOrder).map(([k, v]) => `<option value="${k}" ${o.status === k ? 'selected' : ''}>${v}</option>`).join('')}
            </select>
          </td>
        </tr>`).join('') || '<tr><td colspan="6">אין הזמנות עדיין</td></tr>';
    }

    async function setOrderStatus(id, status) {
      try {
        await api(`/api/admin/orders/${id}/status`, { method: 'POST', body: JSON.stringify({ status }) });
        toast('סטטוס ההזמנה עודכן: ' + stOrder[status]);
      } catch (err) { toast(err.message, true); }
    }

    // אם כבר מחוברים כמנהל — כניסה ישירה
    (async () => {
      if (!TOKEN) return;
      try {
        const me = await api('/api/auth/me');
        if (me.user.role === 'admin') showPanel();
      } catch { /* נדרש להתחבר */ }
    })();
  </script>
</body>
</html>
